{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TransConnect - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
          <span class="brand-mark">T</span> TransConnect
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Afficher la navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'expeditions:liste' %}">Expéditions</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'vehicules:liste' %}">Véhicules</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'offres:liste' %}">Offres</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'entreprises:liste' %}">Entreprises</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="page-shell">
      {% block contenu %}{% endblock %}
    </main>

    <footer class="app-footer">
      <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>TransConnect</span>
        <span>Gestion du transport &copy; 2026</span>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
