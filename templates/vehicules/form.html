{% extends 'base.html' %}
{% block title %}Véhicule{% endblock %}
{% block contenu %}
  <section class="section-card form-card">
    <div class="page-header">
      <h1>Véhicule</h1>
    </div>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-brand" type="submit">Enregistrer</button>
        <a class="btn btn-outline-secondary" href="{% url 'vehicules:liste' %}">Annuler</a>
      </div>
    </form>
  </section>
{% endblock %}
