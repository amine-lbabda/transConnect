{% extends 'base.html' %}
{% block title %}Supprimer une entreprise{% endblock %}
{% block contenu %}
  <section class="section-card confirm-card">
    <h2>Supprimer l'entreprise</h2>
    <p>Voulez-vous vraiment supprimer <strong>{{ entreprise.raison_social }}</strong> ? Cette action est définitive.</p>
    <form method="post" class="d-flex justify-content-center gap-2 mt-4">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Confirmer la suppression</button>
      <a class="btn btn-outline-secondary" href="{% url 'entreprises:liste' %}">Annuler</a>
    </form>
  </section>
{% endblock %}
